<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dark Glow for Tab Contrast -->
    <radialGradient id="tabGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <!-- Rich Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="40%" stop-color="#B45309" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <radialGradient id="goldCrown" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Globe Gradients -->
    <radialGradient id="globeOcean" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="75%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="80%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Arrow Gradients -->
    <linearGradient id="arrowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="arrowDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Back Outer Golden Filigree Ring -->
    <circle cx="256" cy="275" r="172" fill="none" stroke="url(#goldDark)" stroke-width="26" />
    <circle cx="256" cy="275" r="172" fill="none" stroke="url(#goldLight)" stroke-width="18" filter="url(#goldGlow)" />

    <!-- Ornate Khmer Crown Spire on Top -->
    <g transform="translate(0, 5)">
      <!-- Central Spire Tiers -->
      <path d="M 256 30 L 268 70 L 244 70 Z" fill="url(#goldLight)" />
      <circle cx="256" cy="28" r="7" fill="#FEF08A" />
      
      <!-- Tier 2 -->
      <path d="M 235 70 L 277 70 L 285 95 L 227 95 Z" fill="url(#goldCrown)" stroke="#92400E" stroke-width="2" />
      <!-- Tier 3 -->
      <path d="M 220 95 L 292 95 L 302 125 L 210 125 Z" fill="url(#goldLight)" stroke="#92400E" stroke-width="2" />
      <!-- Tier 4 Main Base -->
      <path d="M 200 125 L 312 125 L 325 155 L 187 155 Z" fill="url(#goldDark)" stroke="#92400E" stroke-width="2" />

      <!-- Decorative Filigree Wings on Crown (Kbach Kranok) -->
      <path d="M 256 60 C 290 50 330 80 345 130 C 330 135 310 115 300 110 C 315 135 320 160 305 185 C 290 170 285 150 280 140 Z" fill="url(#goldLight)" />
      <path d="M 256 60 C 222 50 182 80 167 130 C 182 135 202 115 212 110 C 197 135 192 160 207 185 C 222 170 227 150 232 140 Z" fill="url(#goldLight)" />

      <!-- Crown Flame Accents -->
      <path d="M 320 110 C 350 125 380 165 370 205 C 355 195 345 180 340 165 C 348 185 345 205 330 220 C 325 200 325 180 320 165 Z" fill="url(#goldLight)" />
      <path d="M 192 110 C 162 125 132 165 142 205 C 157 195 167 180 172 165 C 164 185 167 205 182 220 C 187 200 187 180 192 165 Z" fill="url(#goldLight)" />
    </g>

    <!-- Lateral Kbach Rosettes / Lotus Ornaments (Left & Right) -->
    <!-- Left Rosette -->
    <g transform="translate(65, 275)">
      <path d="M 0 -25 C 15 -15 15 15 0 25 C -15 15 -15 -15 0 -25 Z" fill="url(#goldLight)" />
      <path d="M -25 0 C -15 15 15 15 25 0 C 15 -15 -15 -15 -25 0 Z" fill="url(#goldCrown)" />
      <circle cx="0" cy="0" r="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2" />
    </g>
    <!-- Right Rosette -->
    <g transform="translate(447, 275)">
      <path d="M 0 -25 C 15 -15 15 15 0 25 C -15 15 -15 -15 0 -25 Z" fill="url(#goldLight)" />
      <path d="M -25 0 C -15 15 15 15 25 0 C 15 -15 -15 -15 -25 0 Z" fill="url(#goldCrown)" />
      <circle cx="0" cy="0" r="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2" />
    </g>

    <!-- Bottom Kbach Lotus Flourish -->
    <g transform="translate(256, 445)">
      <path d="M 0 35 C -30 25 -50 0 -40 -30 C -25 -10 -10 -5 0 -5 C 10 -5 25 -10 40 -30 C 50 0 30 25 0 35 Z" fill="url(#goldLight)" />
      <path d="M 0 25 C -15 15 -25 5 -15 -10 C -5 0 0 0 0 0 C 0 0 5 0 15 -10 C 25 5 15 15 0 25 Z" fill="#FEF08A" />
      <circle cx="0" cy="5" r="7" fill="#78350F" />
    </g>

    <!-- Deep Blue World Globe Sphere -->
    <circle cx="256" cy="275" r="142" fill="url(#globeOcean)" filter="url(#dropShadow)" />

    <!-- Continents Shading (Asia, SE Asia, Cambodia, Australia, Pacific) -->
    <g fill="url(#landGrad)" opacity="0.95">
      <!-- Mainland Asia / China / India -->
      <path d="M 170 200 C 190 190 220 180 260 185 C 290 190 320 180 340 195 C 330 220 310 240 280 235 C 265 240 250 220 230 225 C 210 230 190 215 170 200 Z" />
      <!-- Southeast Asia & Cambodia Highlight -->
      <path d="M 235 225 C 245 220 260 225 265 240 C 260 255 250 265 242 275 C 235 265 230 250 232 235 Z" />
      <circle cx="250" cy="250" r="4.5" fill="#FEF08A" stroke="#B45309" stroke-width="1" /> <!-- Cambodia Node -->
      <!-- Indonesia / Maritime Archipelago -->
      <ellipse cx="230" cy="290" rx="14" ry="4" transform="rotate(-10, 230, 290)" />
      <ellipse cx="260" cy="295" rx="18" ry="5" transform="rotate(5, 260, 295)" />
      <ellipse cx="295" cy="285" rx="16" ry="6" transform="rotate(-15, 295, 285)" />
      <!-- Australia -->
      <path d="M 265 330 C 285 315 320 320 335 340 C 330 365 305 385 275 380 C 260 365 255 345 265 330 Z" />
      <!-- East Asia / Japan arc -->
      <path d="M 330 210 C 338 215 342 230 338 245 C 333 240 330 225 330 210 Z" />
    </g>

    <!-- Globe Atmosphere Specular Rim -->
    <path d="M 130 230 A 142 142 0 0 1 382 230 A 142 135 0 0 0 130 230 Z" fill="#FFFFFF" opacity="0.18" />

    <!-- 3D Golden Planetary Orbital Ring Sweeping Across Globe -->
    <!-- Front Portion of Orbit Ring with 3D Depth -->
    <g filter="url(#goldGlow)">
      <!-- Main Swirling Path -->
      <path d="M 95 355 C 80 375 140 385 220 365 C 320 340 410 280 435 225 C 445 200 415 195 385 210 C 310 250 185 325 95 355 Z" fill="url(#ringGrad)" stroke="#B45309" stroke-width="2" />
      <!-- High-gloss Inner Edge of Ring -->
      <path d="M 115 358 C 190 335 310 265 395 215 C 375 225 270 295 185 340 C 145 355 125 358 115 358 Z" fill="#FFFBEB" opacity="0.85" />
    </g>

    <!-- Center Modern Navigation Pointer / Arrow (Pointing NE toward Cambodia/Asia) -->
    <g transform="translate(256, 275)" filter="url(#dropShadow)">
      <!-- Arrow Left Wing (Bright Highlight) -->
      <path d="M 0 0 L 75 -48 L 10 -15 L -35 20 Z" fill="url(#arrowLight)" />
      <!-- Arrow Right Wing (Beveled Shading) -->
      <path d="M 75 -48 L 40 18 L 10 -15 Z" fill="url(#arrowDark)" />
      <!-- Center Crease Divider -->
      <path d="M 75 -48 L 10 -15" stroke="#475569" stroke-width="1.5" />
      <!-- Sleek Cyan Core Glow -->
      <circle cx="10" cy="-15" r="3.5" fill="#38BDF8" />
    </g>

    <!-- Front Bottom Khmer Golden Framing Scroll Overlay -->
    <path d="M 125 340 C 155 390 200 425 256 430 C 312 425 357 390 387 340 C 370 380 320 415 256 418 C 192 415 142 380 125 340 Z" fill="url(#goldLight)" />
  </g>
</svg>
